<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Store - Home</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="assets/css/styles.css" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar bg-light border-bottom">
      <div class="container-fluid d-flex align-items-center gap-2">
        <!-- Brand -->
        <a class="navbar-brand fw-bold me-2" href="index.html">My Store</a>

        <!-- Search -->
        <form
          class="d-flex flex-grow-1"
          role="search"
          action="search.html"
          method="GET"
          style="max-width: 320px"
        >
          <input
            class="search form-control form-control-sm me-2 p-2 text-center"
            type="search"
            name="q"
            placeholder="Search products…"
            aria-label="Search"
          />
          <button
            class="searchBtn btn btn-sm btn-outline-primary"
            type="submit"
            title="Search"
          >
            <i class="bi bi-search"></i>
          </button>
        </form>

        <!-- Cart icon -->
        <a href="cart.html" class="position-relative ms-2 text-decoration-none">
          <i class="bi bi-cart4 fs-4 text-primary"></i>
          <span
            id="cartBadge"
            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
          >
            0
          </span>
        </a>
      </div>
    </nav>

    <main class="container my-4">
      <div class="hero mb-4">
        <h1 class="mb-1">Shop the latest</h1>
        <p class="text-muted mb-0">
          Simple storefront + Supabase + PayPal checkout.
        </p>
      </div>

      <h4 class="mb-3">Categories</h4>
      <div id="categories" class="row g-3 mb-5"></div>

      <h4 class="mb-3">Featured</h4>
      <div id="featured" class="row g-3"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/supabaseClient.js"></script>
    <script src="assets/js/storeApi.js"></script>
    <script src="assets/js/cart.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/index.js"></script>
  </body>
</html>
