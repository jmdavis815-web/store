<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Store - Admin</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-light border-bottom">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">My Store</a>
        <div class="d-flex gap-2">
          <button
            id="logoutBtn"
            class="btn btn-outline-secondary btn-sm d-none"
          >
            Logout
          </button>
        </div>
      </div>
    </nav>

    <main class="container my-4">
      <div id="loginCard" class="card" style="max-width: 520px">
        <div class="card-body">
          <h4 class="mb-3">Admin login</h4>
          <div class="mb-2">
            <label class="form-label">Email</label>
            <input
              id="email"
              class="form-control"
              type="email"
              autocomplete="username"
              placeholder="email"
            />
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input
              id="password"
              class="form-control"
              type="password"
              autocomplete="current-password"
            />
          </div>
          <button id="loginBtn" class="btn btn-primary w-100">Sign in</button>
          <div id="loginMsg" class="small text-muted mt-2"></div>
        </div>
      </div>

      <div id="adminArea" class="d-none">
        <!-- Categories -->
        <div
          class="d-flex align-items-center justify-content-between mb-3 mt-2"
        >
          <h3 class="mb-0">Categories</h3>
          <button id="newCatBtn" class="btn btn-outline-primary btn-sm">
            New category
          </button>
        </div>

        <div class="row g-4 mb-4">
          <div class="col-12 col-lg-7">
            <div id="catList" class="vstack gap-2"></div>
          </div>

          <div class="col-12 col-lg-5">
            <div class="card">
              <div class="card-body">
                <h5 class="mb-3">Edit category</h5>

                <input type="hidden" id="cid" />

                <div class="mb-2">
                  <label class="form-label">Name</label>
                  <input id="cname" class="form-control" />
                </div>

                <div class="mb-2">
                  <label class="form-label">Slug</label>
                  <input
                    id="cslug"
                    class="form-control"
                    placeholder="e.g. candles"
                  />
                  <div class="form-text">Must be unique.</div>
                </div>

                <div class="d-flex gap-2 mt-3">
                  <button id="saveCatBtn" class="btn btn-primary w-50">
                    Save category
                  </button>
                  <button id="deleteCatBtn" class="btn btn-outline-danger w-50">
                    Delete
                  </button>
                </div>

                <div id="catMsg" class="small text-muted mt-2"></div>
              </div>
            </div>
          </div>
        </div>

        <hr class="my-4" />

        <div class="d-flex align-items-center justify-content-between mb-3">
          <h3 class="mb-0">Products</h3>
          <button id="newBtn" class="btn btn-primary btn-sm">
            New product
          </button>
        </div>

        <div class="row g-4">
          <div class="col-12 col-lg-7">
            <div id="list" class="vstack gap-2"></div>
          </div>

          <div class="col-12 col-lg-5">
            <div class="card">
              <div class="card-body">
                <h5 id="formTitle">Edit product</h5>

                <input type="hidden" id="pid" />

                <div class="mb-2">
                  <label class="form-label">Name</label>
                  <input id="name" class="form-control" />
                </div>

                <div class="mb-2">
                  <label class="form-label">Slug</label>
                  <input
                    id="slug"
                    class="form-control"
                    placeholder="e.g. cool-shirt"
                  />
                  <div class="form-text">Must be unique.</div>
                </div>

                <div class="mb-2">
                  <label class="form-label">Category</label>
                  <select id="category" class="form-select"></select>
                </div>

                <div class="mb-2">
                  <label class="form-label">Price (USD)</label>
                  <input
                    id="price"
                    class="form-control"
                    type="number"
                    min="0"
                    step="0.01"
                  />
                </div>

                <div class="mb-2">
                  <label class="form-label">Description</label>
                  <textarea
                    id="description"
                    class="form-control"
                    rows="4"
                  ></textarea>
                </div>

                <div class="mb-2">
                  <label class="form-label">Active</label>
                  <select id="active" class="form-select">
                    <option value="true">Yes</option>
                    <option value="false">No</option>
                  </select>
                </div>

                <div class="mb-2">
                  <label class="form-label">Image</label>
                  <input
                    id="imageFile"
                    class="form-control"
                    type="file"
                    accept="image/*"
                  />
                  <div class="form-text">Uploads to Supabase Storage.</div>
                </div>

                <div class="d-flex gap-2 mt-3">
                  <button id="saveBtn" class="btn btn-primary w-50">
                    Save
                  </button>
                  <button id="deleteBtn" class="btn btn-outline-danger w-50">
                    Delete
                  </button>
                </div>

                <div id="msg" class="small text-muted mt-2"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/supabaseClient.js"></script>
    <script src="assets/js/storeApi.js"></script>
    <script src="assets/js/admin.js"></script>
  </body>
</html>
