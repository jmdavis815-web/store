<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Store - Cart</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-light border-bottom">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">My Store</a>
        <!-- Search -->
        <form
          class="d-flex mx-auto"
          role="search"
          action="search.html"
          method="GET"
          style="max-width: 420px; width: 100%"
        >
          <input
            class="form-control form-control-sm me-2"
            type="search"
            name="q"
            placeholder="Search products…"
            aria-label="Search"
          />
          <button class="btn btn-sm btn-outline-primary" type="submit">
            Search
          </button>
        </form>
        <div class="d-flex gap-3 align-items-center">
          <a class="btn btn-outline-secondary btn-sm" href="index.html"
            >Continue shopping</a
          >
          <a class="btn btn-primary btn-sm" href="cart.html"
            >Cart (<span id="cartBadge">0</span>)</a
          >
        </div>
      </div>
    </nav>

    <main class="container my-4">
      <div class="row g-4">
        <div class="col-12 col-lg-8">
          <h3 class="mb-3">Your cart</h3>
          <div id="items" class="vstack gap-3"></div>
        </div>

        <div class="col-12 col-lg-4">
          <div class="card">
            <div class="card-body">
              <h5>Summary</h5>
              <div class="d-flex justify-content-between">
                <span class="text-muted">Subtotal</span>
                <span id="subtotal">$0.00</span>
              </div>
              <hr />
              <div id="paypalButtons"></div>
              <div id="status" class="small text-muted mt-2"></div>
              <button
                id="clearBtn"
                class="btn btn-outline-danger btn-sm mt-3 w-100"
              >
                Clear cart
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="assets/js/config.js"></script>

    <!-- PayPal SDK (client-id injected) -->
    <script>
      const s = document.createElement("script");
      s.src = `https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(APP_CONFIG.PAYPAL_CLIENT_ID)}&currency=${encodeURIComponent(APP_CONFIG.CURRENCY)}`;
      document.head.appendChild(s);
    </script>

    <script src="assets/js/cart.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/cartPage.js"></script>
  </body>
</html>
