<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Store - Cart</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="assets/css/styles.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar bg-light border-bottom">
      <div class="container-fluid d-flex align-items-center gap-2">
        <!-- Brand -->
        <a class="navbar-brand fw-bold me-2" href="index.html">My Store</a>

        <!-- Search -->
        <form
          class="d-flex flex-grow-1"
          role="search"
          action="search.html"
          method="GET"
          style="max-width: 320px"
        >
          <input
            class="search form-control form-control-sm me-2 p-2 text-center"
            type="search"
            name="q"
            placeholder="Search products…"
            aria-label="Search"
          />
          <button
            class="searchBtn btn btn-sm btn-outline-primary"
            type="submit"
            title="Search"
          >
            <i class="bi bi-search"></i>
          </button>
        </form>

        <!-- Cart icon -->
        <a href="cart.html" class="position-relative ms-2 text-decoration-none">
          <i class="bi bi-cart4 fs-4 text-primary"></i>
          <span
            id="cartBadge"
            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
          >
            0
          </span>
        </a>
      </div>
    </nav>

    <main class="container my-4">
      <div class="row g-4">
        <div class="col-12 col-lg-8">
          <h3 class="mb-3">Your cart</h3>
          <div id="items" class="vstack gap-3"></div>
        </div>

        <div class="col-12 col-lg-4">
          <div class="card">
            <div class="card-body">
              <h5>Summary</h5>
              <div class="d-flex justify-content-between">
                <span class="text-muted">Subtotal</span>
                <span id="subtotal">$0.00</span>
              </div>
              <div
                id="discountRow"
                class="d-flex justify-content-between d-none"
              >
                <span class="text-muted">Sale discount</span>
                <span id="discount">-$0.00</span>
              </div>
              <hr />
              <div class="d-flex justify-content-between fw-semibold mb-2">
                <span>Total</span>
                <span id="total">$0.00</span>
              </div>
              <div id="paypalButtons"></div>
              <div id="status" class="small text-muted mt-2"></div>
              <button
                id="clearBtn"
                class="btn btn-outline-danger btn-sm mt-3 w-100"
              >
                Clear cart
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="assets/js/config.js"></script>

    <!-- PayPal SDK (client-id injected) -->
    <script>
      const s = document.createElement("script");
      s.src = `https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(APP_CONFIG.PAYPAL_CLIENT_ID)}&currency=${encodeURIComponent(APP_CONFIG.CURRENCY)}`;
      document.head.appendChild(s);
    </script>

    <script src="assets/js/cart.js"></script>
    <script src="assets/js/sales.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/cartPage.js"></script>
  </body>
</html>
