<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Store - Category</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="assets/css/styles.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-light border-bottom">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">My Store</a>
        <!-- Search -->
        <form
          class="d-flex mx-auto"
          role="search"
          action="search.html"
          method="GET"
          style="max-width: 420px; width: 100%"
        >
          <input
            class="form-control form-control-sm me-2"
            type="search"
            name="q"
            placeholder="Search products…"
            aria-label="Search"
          />
          <button class="btn btn-sm btn-outline-primary" type="submit">
            Search
          </button>
        </form>
        <div class="d-flex gap-3 align-items-center">
          <a class="btn btn-primary btn-sm" href="cart.html"
            >Cart (<span id="cartBadge">0</span>)</a
          >
        </div>
      </div>
    </nav>

    <main class="container my-4">
      <div class="d-flex align-items-center justify-content-between mb-3">
        <h2 id="title" class="mb-0">Category</h2>
        <a class="btn btn-outline-secondary btn-sm" href="index.html">Back</a>
      </div>
      <div id="grid" class="row g-3"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/supabaseClient.js"></script>
    <script src="assets/js/storeApi.js"></script>
    <script src="assets/js/cart.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/category.js"></script>
  </body>
</html>
