<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Store - Category</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="assets/css/styles.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-dark">
      <div class="container d-flex align-items-center gap-2">
        <!-- Brand -->
        <a class="navbar-brand fw-bold me-2" href="index.html">My Store</a>

        <!-- Search -->
        <form
          class="d-flex flex-grow-1"
          role="search"
          action="search.html"
          method="GET"
          style="max-width: 320px"
        >
          <input
            class="search form-control form-control-sm p-2 text-center"
            type="search"
            name="q"
            placeholder="Search products…"
            aria-label="Search"
          />
          <button class="searchBtn btn btn-sm" type="submit" title="Search">
            <i class="bi bi-search"></i>
          </button>
        </form>

        <!-- Cart icon -->
        <a href="cart.html" class="position-relative ms-2 text-decoration-none">
          <i class="bi bi-cart4 fs-4"></i>
          <span
            id="cartBadge"
            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
          >
            0
          </span>
        </a>
      </div>
    </nav>

    <main class="container my-4">
      <div id="saleAd" class="mb-3"></div>

      <div class="d-flex align-items-center justify-content-between mb-3">
        <h2 id="title" class="mb-0">Category</h2>
        <a class="btn btn-outline-secondary btn-sm" href="index.html">Back</a>
      </div>
      <div id="grid" class="row g-3"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/supabaseClient.js"></script>
    <script src="assets/js/storeApi.js"></script>
    <script src="assets/js/cart.js"></script>
    <script src="assets/js/sales.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/category.js"></script>
  </body>
</html>
